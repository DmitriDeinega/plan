name: plan

services:
  postgres:
    image: postgres:16
    container_name: plan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: plan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plan}
      POSTGRES_DB: plan_db
    volumes:
      - plan_pg_data:/var/lib/postgresql/data
    # Bound to localhost so the DB is reachable for local psql/migration work but never
    # exposed to the LAN. The backend reaches it over the compose network instead.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plan -d plan_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: plan-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Bind to localhost only: the host's reverse proxy reaches 127.0.0.1:2100,
    # so the port must NOT be exposed to the LAN / public interface.
    ports:
      - "127.0.0.1:2100:2100"
    env_file:
      - ../backend/app/.env
    environment:
      PG_DSN: postgresql://plan:${POSTGRES_PASSWORD:-plan}@postgres:5432/plan_db

volumes:
  plan_pg_data:
